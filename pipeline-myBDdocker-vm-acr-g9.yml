trigger:
  branches:
    include:
      - main

variables:
  VM_IP_PUBLICA: '20.230.10.118'

  IMAGE_NAME: '002agrupo9-sum3-imagen'

  ACR_NAME: 'rc002agrupo9sum3'

  ACR_USERNAME: 'rc002agrupo9sum3'

  ACR_PASSWORD: 'c5botLr1Yn92K2ZfYKQJoVvyh4p7cGnTXF7OVtXAMuereM9UEBDmJQQJ99CIACHYHv6Eqg7NAAACAZCRL83A'

stages:
- stage: Deploy

  jobs:

  - deployment: DeployToVM

    displayName: 'Deploy MySQL to VM'

    environment:
      name: 'env-002agrupo9-sum3'
      resourceType: VirtualMachine

    strategy:
      runOnce:

        deploy:

          steps:

          - script: |

              if ! command -v az > /dev/null; then

                echo "Azure CLI no está instalado. Instalando..."

                export DEBIAN_FRONTEND=noninteractive

                sudo apt-get update
                sudo apt-get install -y curl

                curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

                az --version

              else

                echo "Azure CLI ya está instalado."

              fi

            displayName: 'Verificar e Instalar Azure CLI'

          - script: |

              if ! command -v docker > /dev/null; then

                echo "Docker no está instalado. Instalando..."

                export DEBIAN_FRONTEND=noninteractive

                sudo apt-get update

                sudo apt-get install -y \
                  apt-transport-https \
                  ca-certificates \
                  curl \
                  gnupg \
                  lsb-release

                curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                  | sudo gpg --dearmor \
                  -o /usr/share/keyrings/docker-archive-keyring.gpg

                echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

                sudo apt-get update

                sudo apt-get install -y \
                  docker-ce \
                  docker-ce-cli \
                  containerd.io

                sudo systemctl start docker
                sudo systemctl enable docker

                docker --version

              else

                echo "Docker ya está instalado."

              fi

            displayName: 'Verificar e Instalar Docker'

          - script: |

              echo "Autenticándose en ACR..."

              echo ${ACR_PASSWORD} | sudo docker login \
              ${ACR_NAME}.azurecr.io \
              -u ${ACR_USERNAME} \
              --password-stdin

              echo "Descargando imagen MySQL..."

              sudo docker pull \
              ${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest

              if sudo docker ps -a --format '{{.Names}}' | grep -Eq "^mysql_container$"; then

                echo "Contenedor MySQL existente."

                sudo docker stop mysql_container || true
                sudo docker rm mysql_container || true

              fi

              echo "Creando contenedor MySQL..."

              sudo docker run -d \
                --name mysql_container \
                -p 3306:3306 \
                -e MYSQL_ROOT_PASSWORD=Password123 \
                -e MYSQL_DATABASE=my_database \
                -e MYSQL_USER=mysqluser \
                -e MYSQL_PASSWORD=Password123 \
                ${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest

              sudo docker ps

            displayName: 'Descargar y ejecutar imagen MySQL desde ACR'

          - script: |

              echo "MySQL disponible en:"
              echo "IP: ${VM_IP_PUBLICA}"
              echo "Puerto: 3306"

            displayName: 'Mostrar detalles de conexión'